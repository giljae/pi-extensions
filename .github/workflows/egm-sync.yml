name: EGM upstream sync

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sync vendored EGM
        run: npx tsx scripts/sync-egm.ts --latest --package packages/pi-egm
      - name: Open pull request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: sync-egm
          delete-branch: true
          title: "chore(pi-egm): sync EGM upstream"
          commit-message: "chore(pi-egm): sync EGM upstream"
          body: |
            Automated EGM vendoring sync from `google/elephant-goldfish-model`.

            Review the `UPSTREAM.json` ref/commit change and the vendored diff.
            The integrity test and the rest of CI run on this pull request.
